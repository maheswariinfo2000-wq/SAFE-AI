<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Fire Alert PWA</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f97316">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 16px;
            max-width: 440px;
            width: 100%;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        .icon {
            font-size: 54px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 12px;
            color: #f97316;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 24px;
        }
        .btn {
            display: inline-block;
            background: #f97316;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #ea580c;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡⚠️</div>
        <h1>You are Offline</h1>
        <p>You are currently not connected to the internet. Live satellite feeds and real-time alerts require a connection. Once you're back online, reload the page to get the latest hotspot data.</p>
        <button class="btn" onclick="window.location.reload()">🔄 Try Reconnecting</button>
    </div>
</body>
</html>
